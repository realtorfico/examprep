<!DOCTYPE html>
<html lang="en">
<head>
<!-- Google tag (gtag.js) -->
<!-- fetchpriority="low": gtag.js is 160KB and was landing at 2826ms, competing for bandwidth with
     app.min.js during the render it blocks. Conversion pings only need to fire before the visitor
     leaves, not before the page draws. Turnstile's script is deliberately NOT deprioritised -- the
     buy page waits on it. -->
<script async fetchpriority="low" src="https://www.googletagmanager.com/gtag/js?id=AW-1046929025"></script>
<script defer src="/js/gtag-init.js?v=1"></script>
<!-- Microsoft Clarity (session recordings/heatmaps) -->
<script defer src="/js/clarity-init.js?v=2"></script>
<meta charset="UTF-8">
<!-- Critical CSS for the server-rendered category hero (_worker.js injects it into #app). A plain
     blocking stylesheet on purpose: it has to be applied at first paint or that server-rendered
     headline paints unstyled and reflows. Generated from style.css by scripts/build-hero-css.js
     (~5.5KB, ~1.5KB on the wire) -- never edit it by hand, and rebuild it whenever style.css
     changes. style.min.css keeps its own non-blocking preload + deferred-attach path below. -->
<link rel="stylesheet" href="/css/hero.css?v=3">
<!-- Inter is preloaded; Fraunces is not. Measured three ways on 2026-09-17:
     - neither preloaded: FCP ~980ms, but Inter swapping in re-wraps the header promo ribbon, which
       moves the whole page -- an INTERMITTENT CLS of 0.18 (2 of 4 runs; the others 0.003, which is
       what makes font-swap shifts easy to miss).
     - both preloaded: CLS 0, FCP ~1220ms. A font preload is high-priority, so 113KB of font
       outranks everything else on a 1.6Mbps link.
     - Inter only, subset: the ribbon is stable and the H1's fallback (Georgia) doesn't change its
       line count, so Fraunces can swap late without moving anything.
     Both files are subset by scripts/build-fonts.js. Don't add a Fraunces preload without
     re-measuring FCP, and don't drop this one without re-measuring CLS several times. -->
<link rel="preload" as="font" type="font/woff2" href="/fonts/inter-var-subset.woff2" crossorigin>
<link rel="preload" href="/css/style.min.css?v=13" as="style">
<!-- app.min.js renders every page. Measured 2026-09-17 on a throttled mobile profile, it was the
     LAST same-origin script to start downloading (2258ms), queued behind ~10 smaller ones, which
     is most of why /cdl showed nothing for ~2.8s. The preload lifts it out of that queue; keep its
     ?v= in lockstep with the <script> tag at the end of <body> or the bundle downloads twice. -->
<link rel="preload" as="script" fetchpriority="high" href="/js/app.min.js?v=31">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PassExamHQ</title>
<meta name="description" content="Exam prep practice questions, timed to how you actually study.">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0f2a5f">
<script defer src="/js/load-css.js?v=13"></script>
<!-- Keeps the server-rendered hero CTA from being a dead button between ~1s (it paints) and ~3s
     (app.min.js runs and owns the handler). See js/early-cta.js. -->
<script defer src="/js/early-cta.js?v=1"></script>
<noscript><link rel="stylesheet" href="/css/style.min.css?v=13"></noscript>
<script src="/js/turnstile-callback.js?v=103"></script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onTurnstileLoad&render=explicit" async defer></script>
</head>
<body>
<div id="site-header"></div>
<div id="app"></div>
<div id="site-footer"></div>
<div id="help-chat-root"></div>
<div id="report-issue-root"></div>
<div id="suggestion-root"></div>
<script defer src="/js/config.js?v=103"></script>
<script defer src="/js/api.js?v=104"></script>
<script defer src="/js/speech.js?v=103"></script>
<script defer src="/js/app.min.js?v=31"></script>
</body>
</html>
